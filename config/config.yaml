# ============================================================
# notification-service 配置（本地开发环境）
# ============================================================
# 说明：
#   1. 环境切换：容器部署时由环境变量 APP_ENV 选择 config_<env>.yaml
#      （如 APP_ENV=test → config_test.yaml），本文件为本地开发默认值。
#   2. 端口约定（全仓库统一）：gRPC 用 91xx 段，HTTP 用 808x 段，
#      Metrics 用 909x 段，避免与 MinIO 的 90xx 段冲突。
# ============================================================

app:
  name: "notification-service"
  env: "development"
  # 日志目录与级别：日志按天分文件写入 log_dir，级别以下不输出
  log_dir: "./logs"
  log_level: "info"

# gRPC 服务：唯一业务入口（消息写入/列表/未读数/标记已读）。
# 下游 article/comment 等服务经 consul resolver 按服务名发现本端口。
grpc:
  host: "0.0.0.0"
  port: 9105

# HTTP 服务：仅承载 WebSocket（/ws/notification）与健康检查探针，
# 业务 REST 不在此端口 —— 前端经 Nginx → Gateway(WS 反向代理) → 本端口建连。
# 注意：WriteTimeout 会限制 WS 连接的总时长，gin/net/http 对升级后的
# 连接不再按该超时掐断，故无需为 WS 单独调大（升级握手本身要求快）。
http:
  host: "0.0.0.0"
  port: 8085

# 数据库：站内消息独立库 notification_db（与业务库隔离），
# 建表语句见 infra/scripts/init.sql（notifications 表）。
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "password"
  name: "notification_db"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 3600

# Redis：未读计数缓存（key 前缀 notification:unread:<user_id>，TTL 10 分钟）。
# KeyPrefix 由代码强制覆写为 constants.RedisKeyPrefixNotification，
# 此处无需（也不应）手工配置。
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 100

# JWT：必须与 user-service 签发密钥一致。
# 用途有两处——gRPC 鉴权拦截器校验业务调用方身份；
# WS 握手时校验 ?token= 查询参数中的 JWT 提取 user_id。
jwt:
  secret: "your-secret-key-change-in-production"
  expire_time: 168 # 7 days in hours

# Consul：注册本服务（gRPC + HTTP 两个端口都注册），
# 供 Gateway 同步路由（/api/v1/notification/*）与 WS 反向代理寻址。
consul:
  address: "localhost:8500"
  check_interval: 10        # 健康检查间隔（秒）
  deregister_critical: 30   # 连续不健康多久后自动摘除（秒）

# Prometheus 指标暴露端口（独立于业务 HTTP 端口）
metrics:
  enabled: true
  path: "/metrics"
  port: 9099

# 限流：本服务不做 HTTP 业务限流（REST 流量经网关，网关已限流），
# gRPC 写入 QPS 主要来自内部服务，量级可控。
rate_limit:
  enabled: false
  qps: 1000
  burst: 2000

# HTTP server 超时（秒）。WS 升级后的长连接不受这些超时约束
# （由 ws 包内的 ping/pong 心跳管理，见 internal/ws/handler.go）。
server:
  grpc_timeout: 10
  http_read_timeout: 15
  http_write_timeout: 15
  http_idle_timeout: 60
  http_read_header_timeout: 10
  http_default_timeout: 30

# 弹性配置（Consul 配置中心热更下发后覆盖本地默认）：
# 熔断作用于本服务对外的 gRPC 一元调用（入口拦截器），
# 超时按方法分级（GRPCMethodTimeout），此处为服务级兜底。
resilience:
  notification.v1.NotificationService:
    timeout_sec: 3
    circuit:
      max_requests: 5     # 半开状态放行的探测请求数
      interval_sec: 10    # 计数统计窗口
      timeout_sec: 5      # 熔断持续时间，过后进入半开
