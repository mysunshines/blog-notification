# ============================================================
# notification-service 配置（Docker test 环境）
# ------------------------------------------------------------
# 由 docker-compose 注入 APP_ENV=test 时加载（CONFIG_PATH=config/config_test.yaml）。
# 与本地 config.yaml 的差异：地址全部指向 docker 网络内的基础设施容器
# （mysql / redis / consul 均为 shared-infra 网络中的 service 名）。
# ============================================================

app:
  name: "notification-service"
  env: "test"
  log_level: "debug"

# gRPC 91xx 段（与其它服务统一：user 9101 / article 9102 / comment 9103 / notification 9104）
grpc:
  host: "0.0.0.0"
  port: 9104

# HTTP：承载 WS（/ws/notification）+ 探活，容器内 8085，
# docker-compose 已映射宿主机 8085（Gateway 的 WS 反向代理目标）。
http:
  host: "0.0.0.0"
  port: 8085

database:
  host: "mysql"
  port: 3306
  user: "root"
  password: "root123"    # 与 docker-compose.infra.yml 中 MySQL 初始化口令一致
  name: "notification_db"
  max_open_conns: 25     # 容器部署收紧连接数（多副本共享 MySQL max_connections）
  max_idle_conns: 5
  conn_max_lifetime: 3600

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  pool_size: 100

# 与 user-service test 环境签发密钥一致（gateway 同）
jwt:
  secret: "test-secret-key-do-not-use-in-production"
  expire_time: 604800    # 秒；7 天

consul:
  address: "consul:8500"
  check_interval: 10
  deregister_critical: 30

metrics:
  enabled: true
  path: "/metrics"
  port: 9096

rate_limit:
  enabled: true
  qps: 2000
  burst: 4000

# 键名必须为嵌套结构，扁平写法会被 yaml 静默忽略
server:
  grpc:
    default_timeout_sec: 10
    max_connection_idle_sec: 60
    max_connection_age_sec: 120
    max_connection_age_grace_sec: 30
    min_ping_interval_sec: 30
    max_concurrent_streams: 100
  http:
    read_timeout_sec: 30
    read_header_timeout_sec: 10
    write_timeout_sec: 30
    idle_timeout_sec: 120
    default_timeout_sec: 30

loki:
  enabled: false
  url: "http://loki:3100/loki/api/v1/push"
  tenant_id: ""

otel:
  enabled: false
  endpoint: "otel-collector:4317"
